<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script> tailwind.config = { theme: { extend: { colors: { corp: { blue: '#0f172a', lightBlue: '#1e293b', accent: '#3b82f6', gold: '#f59e0b' } }, fontFamily: { sans: ['Sarabun', 'sans-serif'] } } } } </script>
    <style>
        body { background-image: linear-gradient(rgba(15,23,42,0.95), rgba(15,23,42,0.95)), url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=2070&q=80'); background-size: cover; background-attachment: fixed; font-family: 'Sarabun', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: #1e293b; } ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .folder-tab { clip-path: polygon(0 0, 150px 0, 170px 100%, 100% 100%, 100% 100%, 0 100%); }
        .status-waiting { animation: blink-yellow 2s infinite ease-in-out; font-weight: bold; color: #facc15; }
        @keyframes blink-yellow { 0%, 100% { opacity: 1; color: #facc15; text-shadow: 0 0 5px rgba(250, 204, 21, 0.3); } 50% { opacity: 0.6; color: #fde047; text-shadow: none; } }
        .alert-text-medium { display: block; font-weight: bold; color: #f59e0b; margin-top: 10px; font-size: 1.1em; }
        .alert-text-high { display: block; font-weight: 800; color: #ef4444; margin-top: 10px; font-size: 1.2em; text-decoration: underline; }
    </style>
</head>
<body class="text-slate-200 h-screen flex flex-col overflow-hidden">

    <header class="bg-corp-blue border-b border-slate-700 shadow-lg z-20">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white rounded p-1 shadow-md h-12 w-12 flex items-center justify-center overflow-hidden"><span class="text-2xl">🛠️</span></div>
                <div><h1 class="text-xl font-bold text-white">MAINTENANCE SYSTEM</h1><p class="text-xs text-corp-gold font-medium tracking-wider uppercase">Secure Dual-Link System</p></div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="refreshData()" class="p-2 rounded-full hover:bg-slate-700 transition text-slate-400 hover:text-white" title="Refresh">🔄</button>
                <button id="btnLogin" onclick="showLoginModal()" class="bg-corp-gold text-corp-blue font-bold py-2 px-4 rounded-md shadow-md flex items-center gap-2">🔐 Admin</button>
                <button id="btnLogout" onclick="logout()" class="hidden bg-red-600 text-white font-bold py-2 px-4 rounded-md shadow-md flex items-center gap-2">🚪 Logout</button>
            </div>
        </div>
    </header>

    <nav class="bg-corp-lightBlue border-b border-slate-700 shadow-md z-10">
        <div class="container mx-auto px-4"><div class="flex space-x-1 overflow-x-auto">
            <button onclick="switchTab('request')" id="tab-request" class="tab-btn px-6 py-3 text-sm font-medium border-b-2 border-transparent hover:text-corp-gold transition text-corp-gold border-corp-gold">📝 แจ้งซ่อม</button>
            <button onclick="switchTab('status')" id="tab-status" class="tab-btn px-6 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-white transition">📊 ติดตามงาน</button>
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-btn hidden admin-only px-6 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-white transition">📈 แดชบอร์ด</button>
            <button onclick="switchTab('settings')" id="tab-settings" class="tab-btn hidden admin-only px-6 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-white transition">⚙️ ตั้งค่า</button>
        </div></div>
    </nav>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-900/50 relative">
        <div id="view-request" class="view-section max-w-3xl mx-auto fade-in">
            <div class="bg-corp-lightBlue rounded-xl shadow-2xl border border-slate-700 overflow-hidden">
                <div class="bg-gradient-to-r from-corp-blue to-corp-lightBlue p-4 border-b border-slate-700"><h2 class="text-xl font-bold text-white">📝 แบบฟอร์มแจ้งซ่อม</h2></div>
                <div class="p-6">
                    <form id="requestForm" onsubmit="submitRequest(event)" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div><label class="block text-sm text-slate-400 mb-1">ชื่อผู้แจ้ง</label><input type="text" id="reqName" required class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"></div>
                            <div><label class="block text-sm text-slate-400 mb-1">สถานที่</label><select id="reqDept" required class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"><option value="">-- รอข้อมูล... --</option></select></div>
                            <div><label class="block text-sm text-slate-400 mb-1">เบอร์ติดต่อ</label><input type="tel" id="reqPhone" required class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"></div>
                            <div><label class="block text-sm text-slate-400 mb-1">รหัสอุปกรณ์</label><input type="text" id="reqEquipId" class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"></div>
                            <div class="md:col-span-2"><label class="block text-sm text-slate-400 mb-1">ชื่ออุปกรณ์</label><input type="text" id="reqEquip" required class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"></div>
                        </div>
                        <div><label class="block text-sm text-slate-400 mb-1">รายละเอียดปัญหา</label><textarea id="reqDetail" rows="4" required class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"></textarea></div>
                        <div><label class="block text-sm text-slate-400 mb-3">ระดับความเร่งด่วน</label><div class="flex gap-4">
                            <label class="flex items-center gap-2 p-3 rounded border border-slate-600 w-full justify-center has-[:checked]:bg-green-500/10 has-[:checked]:border-green-500"><input type="radio" name="urgency" value="Low" class="accent-green-500" checked><span class="text-green-400">ปกติ</span></label>
                            <label class="flex items-center gap-2 p-3 rounded border border-slate-600 w-full justify-center has-[:checked]:bg-yellow-500/10 has-[:checked]:border-yellow-500"><input type="radio" name="urgency" value="Medium" class="accent-yellow-500"><span class="text-yellow-400">ด่วน</span></label>
                            <label class="flex items-center gap-2 p-3 rounded border border-slate-600 w-full justify-center has-[:checked]:bg-red-500/10 has-[:checked]:border-red-500"><input type="radio" name="urgency" value="High" class="accent-red-500"><span class="text-red-400">ด่วนมาก</span></label>
                        </div></div>
                        <button type="submit" class="w-full bg-gradient-to-r from-corp-gold to-yellow-600 hover:from-yellow-500 text-corp-blue font-bold py-3 rounded shadow-lg">🚀 ส่งข้อมูล</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="view-settings" class="view-section hidden max-w-5xl mx-auto fade-in">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="bg-corp-lightBlue rounded-xl border border-slate-700 p-6 shadow-lg">
                    <h3 class="text-lg font-bold text-corp-gold mb-4 border-b border-slate-700 pb-2">🔗 System Links</h3>
                    <div class="mb-4">
                        <label class="block text-xs text-slate-400 mb-1">1. Core Job URL (GAS 1: Jobs)</label>
                        <input id="setting-core-url" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-xs" placeholder="วางลิงก์ GAS ที่ 1 ตรงนี้">
                    </div>
                    <div class="mb-4">
                        <label class="block text-xs text-slate-400 mb-1">2. GitHub Proxy URL (GAS 2: Lists)</label>
                        <input id="setting-proxy-url" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-xs" placeholder="วางลิงก์ GAS ที่ 2 ตรงนี้">
                    </div>
                    <div class="flex gap-2 mt-4">
                         <button onclick="saveSystemSettings()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded text-sm font-bold">บันทึก URL</button>
                         <button onclick="testLink('proxy')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded text-sm">Test List</button>
                         <button onclick="resetConfig()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded text-sm">Reset</button>
                    </div>
                </div>

                <div class="bg-corp-lightBlue rounded-xl border border-slate-700 p-6 shadow-lg">
                    <h3 class="text-lg font-bold text-corp-gold mb-4 border-b border-slate-700 pb-2">📋 List Management</h3>
                    <div class="mb-4">
                        <label class="text-xs text-slate-400 block mb-1">Departments</label>
                        <div class="flex gap-2 mb-2"><input id="new-dept" class="flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1 text-xs" placeholder="เพิ่มแผนก..."><button onclick="modifyList('depts','add', 'new-dept')" class="bg-green-600 px-3 rounded text-xs font-bold">Add</button></div>
                        <ul id="list-dept" class="h-24 overflow-y-auto bg-slate-900 border border-slate-700 p-1 text-xs text-slate-300 rounded"><li class="text-center pt-8 text-slate-500">รอการเชื่อมต่อ...</li></ul>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Technicians</label>
                        <div class="flex gap-2 mb-2"><input id="new-tech" class="flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1 text-xs" placeholder="เพิ่มช่าง..."><button onclick="modifyList('techs','add', 'new-tech')" class="bg-green-600 px-3 rounded text-xs font-bold">Add</button></div>
                        <ul id="list-tech" class="h-24 overflow-y-auto bg-slate-900 border border-slate-700 p-1 text-xs text-slate-300 rounded"><li class="text-center pt-8 text-slate-500">รอการเชื่อมต่อ...</li></ul>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="view-status" class="view-section hidden container mx-auto fade-in"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold text-white">📂 แฟ้มงานซ่อม</h2><input onkeyup="renderStatus(this.value)" placeholder="🔍 ค้นหา..." class="bg-slate-900 border border-slate-600 rounded-full px-4 py-2 text-sm w-64"></div><div id="statusFolders" class="space-y-4"></div></div>
        <div id="view-dashboard" class="view-section hidden container mx-auto fade-in"><div class="grid grid-cols-4 gap-4 mb-6"><div class="bg-slate-800 p-4 rounded shadow"><div class="text-xs text-slate-400">TOTAL</div><div id="kpi-total" class="text-2xl font-bold">0</div></div></div><div class="bg-slate-800 rounded overflow-hidden"><table class="w-full text-left text-sm"><thead class="bg-slate-900 text-slate-400"><tr><th class="p-3">ID</th><th class="p-3">User</th><th class="p-3">Status</th><th class="p-3">Action</th></tr></thead><tbody id="adminTableBody"></tbody></table></div></div>
    </main>

    <div id="adminModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center backdrop-blur-sm"><div class="bg-corp-lightBlue w-full max-w-2xl rounded-xl border border-slate-600 shadow-2xl p-6 m-4 max-h-[90vh] overflow-y-auto"><h3 class="text-xl font-bold text-corp-gold mb-4">Manage Job</h3><input type="hidden" id="modalJobId"><div class="grid grid-cols-2 gap-4 mb-4"><div><label class="text-xs text-slate-400">Status</label><select id="modalStatus" onchange="toggleCost()" class="w-full bg-slate-900 border border-slate-600 rounded p-2"><option>Waiting</option><option>Processing</option><option>Done</option></select></div><div><label class="text-xs text-slate-400">Tech</label><select id="modalTech" class="w-full bg-slate-900 border border-slate-600 rounded p-2"></select></div></div><div class="mb-4"><label class="text-xs text-slate-400">Remarks</label><textarea id="modalRemark" class="w-full bg-slate-900 border border-slate-600 rounded p-2" rows="2"></textarea></div><div id="costSection" class="hidden border-t border-slate-600 pt-4 bg-slate-800/50 p-4 rounded-lg mb-4"><h4 class="text-green-400 font-bold mb-2 flex justify-between"><span>💰 Cost</span><span id="grandTotal">0.00 ฿</span></h4><div id="itemsContainer" class="space-y-2 mb-2"></div><button onclick="addItemRow()" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-2 py-1 rounded">+ Item</button><div class="mt-2"><label class="text-xs text-slate-400">Notes</label><textarea id="modalNotes" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-xs"></textarea></div></div><div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 rounded text-slate-300 hover:bg-slate-700">Cancel</button><button onclick="saveJob()" class="bg-corp-gold text-corp-blue font-bold px-6 py-2 rounded">Save</button></div></div></div>

    <script>
        let appData = { reqs: [], lists: {depts:[], techs:[]}, sha: null, isAdmin: false, cfg: { coreUrl:'', proxyUrl:'', adminPass:'888', jobId:{prefix:'MTN', year:'YYYY', digits:4} } };

        function callApi(url, act, p={}) {
            return new Promise((res, rej) => {
                if(!url) return rej("ไม่พบ URL: กรุณาไปตั้งค่าในเมนู Settings");
                const cb = 'cb_'+Math.round(Math.random()*1e9), s = document.createElement('script');
                s.src = `${url}?${new URLSearchParams({action:act, callback:cb, ...p})}`;
                window[cb] = d => { delete window[cb]; document.body.removeChild(s); res(d); };
                s.onerror = () => { delete window[cb]; document.body.removeChild(s); rej("เชื่อมต่อล้มเหลว (เช็ค URL)"); };
                document.body.appendChild(s);
            });
        }

        // --- LISTS & PROXY ---
        async function loadLists(m=false) {
            if(!appData.cfg.proxyUrl) return;
            if(m) Swal.showLoading();
            try {
                const r = await callApi(appData.cfg.proxyUrl, 'load');
                if(r.status==='success') { 
                    appData.lists=r.data; appData.sha=r.sha; renderLists(); renderDrops(); 
                    if(m) Swal.fire('สำเร็จ', 'โหลดรายชื่อแล้ว', 'success');
                } else throw new Error(r.message);
            } catch(e) { if(m) Swal.fire('Error', e.toString(), 'error'); }
        }
        async function modifyList(t, act, id) {
            const v = act==='add'?document.getElementById(id).value.trim():id; if(!v) return;
            let l = [...(appData.lists[t]||[])]; if(act==='add') l.push(v); else l=l.filter(x=>x!==v);
            Swal.showLoading();
            try {
                let nd = {...appData.lists}; nd[t]=l;
                const r = await callApi(appData.cfg.proxyUrl, 'save', { content: JSON.stringify(nd,null,2), sha: appData.sha });
                if(r.status==='success') { appData.sha=r.sha; appData.lists=nd; if(act==='add') document.getElementById(id).value=''; renderLists(); renderDrops(); Swal.close(); }
                else throw new Error(r.message);
            } catch(e) { Swal.fire('Error', 'บันทึกไม่สำเร็จ: '+e, 'error'); }
        }

        // --- CORE LOGIC ---
        document.addEventListener('DOMContentLoaded', () => { loadSettings(); refreshData(true); loadLists(); });

        async function submitRequest(e) {
            e.preventDefault();
            const urg = document.querySelector('input[name="urgency"]:checked').value;
            const p = {
                requesterName: document.getElementById('reqName').value,
                positionDept: document.getElementById('reqDept').value,
                phoneNumber: document.getElementById('reqPhone').value,
                equipmentLocation: document.getElementById('reqEquip').value,
                problemDetails: document.getElementById('reqDetail').value,
                urgency: urg, status: 'Waiting', jobIdConfig: JSON.stringify(appData.cfg.jobId)
            };
            Swal.showLoading();
            try {
                const r = await callApi(appData.cfg.coreUrl, 'submit', p);
                if(r.status==='success') {
                    document.getElementById('requestForm').reset();
                    let h = `Job: ${r.jobId}`, ic='success', ti='บันทึกสำเร็จ';
                    if(urg==='Medium') { ti='⚠️ แจ้งเตือนด่วน'; ic='warning'; h+=`<br><div class="alert-text-medium">โทร: 0982799918 (คุณพิทวัส)</div>`; }
                    if(urg==='High') { ti='🚨 แจ้งเตือนด่วนมาก'; ic='warning'; h+=`<br><div class="alert-text-high">โทรทันที: 0982799918 (คุณพิทวัส)</div>`; }
                    Swal.fire({icon:ic, title:ti, html:h, background:'#1e293b', color:'#fff', confirmButtonColor:'#f59e0b'});
                    refreshData(true); switchTab('status');
                } else throw new Error(r.message);
            } catch(e) { Swal.fire('Error', e.toString(), 'error'); }
        }

        async function refreshData(s) {
            if(!appData.cfg.coreUrl) return; if(!s) Swal.showLoading();
            try { const r = await callApi(appData.cfg.coreUrl, 'fetch'); if(r.status==='success') { appData.reqs=r.data; renderStatus(); if(appData.isAdmin) renderAdmin(); if(!s) Swal.close(); } } catch(e) {}
        }
        
        // --- UI ---
        function renderLists() { ['depts','techs'].forEach(k => document.getElementById('list-'+k.slice(0,-1)).innerHTML = (appData.lists[k]||[]).map(x=>`<li class="flex justify-between border-b border-slate-700 p-1"><span>${x}</span><button onclick="modifyList('${k}','del','${x}')" class="text-red-400">×</button></li>`).join('')); }
        function renderDrops() {
            const o = l => '<option value="">-- เลือก --</option>' + (l||[]).map(x=>`<option>${x}</option>`).join('');
            document.getElementById('reqDept').innerHTML=o(appData.lists.depts); document.getElementById('modalTech').innerHTML=o(appData.lists.techs);
        }
        function renderStatus(q='') {
            const c=document.getElementById('statusFolders'); c.innerHTML='';
            const d=appData.reqs.filter(r=>(r.jobID+r.requesterName).toLowerCase().includes(q.toLowerCase()));
            if(!d.length) return c.innerHTML='<div class="text-center text-slate-500 py-10">ไม่พบข้อมูล</div>';
            const g = d.reduce((a,r)=>{ const k=(r.requestDate||'').substring(0,7); (a[k]=a[k]||[]).push(r); return a; }, {});
            Object.keys(g).sort().reverse().forEach((k,i)=>{
                const rows = g[k].map(r=>{
                    let s='text-slate-400'; if(r.status=='Done')s='text-green-400'; else if(r.status=='Waiting')s='status-waiting';
                    return `<tr class="hover:bg-slate-800/50 border-b border-slate-800 text-slate-300"><td class="p-3 text-corp-gold font-mono">${r.jobID}</td><td class="p-3">${new Date(r.requestDate).toLocaleDateString('th-TH')}</td><td class="p-3">${r.equipmentLocation}</td><td class="p-3 truncate max-w-xs">${r.problemDetails}</td><td class="p-3 ${s}">${r.status}</td></tr>`;
                }).join('');
                c.innerHTML+=`<div class="bg-slate-800 rounded mb-2"><div onclick="this.nextElementSibling.classList.toggle('hidden')" class="p-3 font-bold cursor-pointer hover:bg-slate-700">📁 ${k} (${g[k].length})</div><div class="${(q||i==0)?'':'hidden'} bg-slate-900/50"><table class="w-full text-sm text-left"><thead><tr class="text-slate-500"><th class="p-3">ID</th><th class="p-3">Date</th><th class="p-3">Equip</th><th class="p-3">Detail</th><th class="p-3">Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
            });
        }
        function renderAdmin() {
            document.getElementById('adminTableBody').innerHTML = appData.reqs.map(r => `<tr class="border-b border-slate-700 hover:bg-slate-800"><td class="p-3"><button onclick="openModal('${r.jobID}')" class="bg-blue-600 px-2 py-1 rounded text-xs">Edit</button></td><td class="p-3 font-mono text-xs">${r.jobID}</td><td class="p-3 text-sm">${r.requesterName}</td><td class="p-3 text-sm">${r.equipmentLocation}</td><td class="p-3 text-xs">${r.status}</td></tr>`).join('');
        }

        // --- SYSTEM ---
        function loadSettings() {
            const c = JSON.parse(localStorage.getItem('maint_cfg_v11')||'{}');
            appData.cfg = {...appData.cfg, ...c};
            // Force hardcoded pass (กัน localstorage ทับ)
            appData.cfg.adminPass = '888'; 
            document.getElementById('setting-core-url').value = appData.cfg.coreUrl;
            document.getElementById('setting-proxy-url').value = appData.cfg.proxyUrl;
        }
        function saveSystemSettings() {
            appData.cfg.coreUrl = document.getElementById('setting-core-url').value;
            appData.cfg.proxyUrl = document.getElementById('setting-proxy-url').value;
            localStorage.setItem('maint_cfg_v11', JSON.stringify(appData.cfg));
            Swal.fire('Saved','','success'); refreshData(); loadLists();
        }
        function resetConfig() { localStorage.removeItem('maint_cfg_v11'); location.reload(); }
        function testLink(t) {
            const u = t==='core'?appData.cfg.coreUrl:appData.cfg.proxyUrl;
            const a = t==='core'?'fetch':'load';
            Swal.showLoading(); callApi(u, a).then(()=>Swal.fire('OK','เชื่อมต่อสำเร็จ','success')).catch(()=>Swal.fire('Fail','ตรวจสอบ URL','error'));
        }

        // --- AUTH ---
        async function showLoginModal() {
            const {value:p} = await Swal.fire({title:'Admin', input:'password', background:'#1e293b', color:'#fff'});
            if(p===appData.cfg.adminPass) { 
                appData.isAdmin=true; 
                document.querySelectorAll('.admin-only').forEach(e=>e.classList.remove('hidden')); 
                document.getElementById('btnLogin').classList.add('hidden'); 
                document.getElementById('btnLogout').classList.remove('hidden'); 
                switchTab('settings');
            } else if(p) Swal.fire('Error','รหัสผิด','error');
        }
        function switchTab(id) {
            document.querySelectorAll('.view-section').forEach(e=>e.classList.add('hidden')); document.querySelectorAll('.tab-btn').forEach(e=>e.classList.replace('text-corp-gold','text-slate-400'));
            document.getElementById('view-'+id).classList.remove('hidden'); document.getElementById('tab-'+id).classList.replace('text-slate-400','text-corp-gold');
            if(id==='dashboard') { document.getElementById('kpi-total').innerText=appData.reqs.length; renderAdmin(); }
        }
        function logout() { location.reload(); }

        // --- MODAL JOB ---
        async function saveJob() {
            const st = document.getElementById('modalStatus').value;
            let it=[], cost=0;
            if(st==='Done') document.querySelectorAll('.item-row').forEach(r=>{
                const n=r.querySelector('.i-n').value, q=r.querySelector('.i-q').value, p=r.querySelector('.i-p').value;
                if(n) { const t=q*p; it.push({name:n, quantity:q, unitPrice:p, total:t}); cost+=t; }
            });
            const p = {
                jobId: document.getElementById('modalJobId').value, status: st, technician: document.getElementById('modalTech').value,
                adminRemarks: document.getElementById('modalRemark').value, additionalNotes: document.getElementById('modalAdditionalNotes').value,
                cost: cost, itemsData: JSON.stringify(it)
            };
            if(st==='Processing') p.acceptedDate = new Date().toISOString();
            if(st==='Done') p.completedDate = new Date().toISOString();
            Swal.showLoading();
            try { const r = await callApi(appData.cfg.coreUrl, 'update', p); if(r.status==='success') { closeModal(); refreshData(true); Swal.fire('Saved','','success'); } else throw new Error(r.message); } catch(e) { Swal.fire('Error',e.toString(),'error'); }
        }
        function openModal(id) {
            const r = appData.reqs.find(x=>x.jobID===id); if(!r) return;
            document.getElementById('modalJobId').value=id; document.getElementById('modalStatus').value=r.status;
            document.getElementById('modalTech').value=r.technician; document.getElementById('modalRemark').value=r.adminRemarks;
            document.getElementById('modalAdditionalNotes').value=r.additionalNotes;
            document.getElementById('itemsContainer').innerHTML='';
            try{ JSON.parse(r.itemsData).forEach(i=>addItemRow(i.name,i.quantity,i.unitPrice)); }catch(e){ addItemRow(); }
            toggleCost(); document.getElementById('adminModal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('adminModal').classList.add('hidden'); }
        function toggleCost() { document.getElementById('costSection').style.display=document.getElementById('modalStatus').value==='Done'?'block':'none'; }
        function addItemRow(n='',q=1,p=0) {
            const d=document.createElement('div'); d.className='grid grid-cols-6 gap-2 item-row';
            d.innerHTML=`<input class="col-span-3 bg-slate-900 border border-slate-600 rounded px-1 i-n" value="${n}"><input type="number" class="col-span-1 bg-slate-900 border border-slate-600 rounded px-1 i-q" value="${q}" onchange="calcTotal()"><input type="number" class="col-span-1 bg-slate-900 border border-slate-600 rounded px-1 i-p" value="${p}" onchange="calcTotal()"><button onclick="this.parentElement.remove();calcTotal()" class="text-red-400">×</button>`;
            document.getElementById('itemsContainer').appendChild(d); calcTotal();
        }
        function calcTotal() {
            let t=0; document.querySelectorAll('.item-row').forEach(r => t += r.querySelector('.i-q').value * r.querySelector('.i-p').value);
            document.getElementById('grandTotal').innerText = t.toFixed(2) + ' ฿';
        }
    </script>
</body>
</html>
