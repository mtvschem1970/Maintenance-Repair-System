<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance System - VS Chem (1970)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script> tailwind.config = { theme: { extend: { colors: { corp: { blue: '#0f172a', lightBlue: '#1e293b', accent: '#3b82f6', gold: '#f59e0b' } }, fontFamily: { sans: ['Sarabun', 'sans-serif'] } } } } </script>
    <style>
        body { background-image: linear-gradient(rgba(15,23,42,0.95), rgba(15,23,42,0.95)), url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=2070&q=80'); background-size: cover; background-attachment: fixed; font-family: 'Sarabun', sans-serif; -webkit-user-select: none; user-select: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: #1e293b; } ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .status-waiting { animation: blink-yellow 2s infinite ease-in-out; font-weight: bold; color: #facc15; }
        @keyframes blink-yellow { 0%, 100% { opacity: 1; color: #facc15; text-shadow: 0 0 5px rgba(250, 204, 21, 0.3); } 50% { opacity: 0.6; color: #fde047; text-shadow: none; } }
        .preview-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #475569; }
    </style>
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }
    </script>
</head>
<body class="text-slate-200 h-screen flex flex-col overflow-hidden">

    <header class="bg-corp-blue border-b border-slate-700 shadow-lg z-20">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white rounded p-1 shadow-md h-12 w-12 flex items-center justify-center overflow-hidden"><span class="text-2xl">🛠️</span></div>
                <div><h1 class="text-xl font-bold text-white">MAINTENANCE SYSTEM</h1><p class="text-xs text-corp-gold font-medium tracking-wider uppercase">Vschem1970 (Phra samut chedi)</p></div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="refreshData()" class="p-2 rounded-full hover:bg-slate-700 transition text-slate-400 hover:text-white">🔄</button>
                <button id="btnLogin" onclick="showLoginModal()" class="bg-corp-gold text-corp-blue font-bold py-2 px-4 rounded-md shadow-md flex items-center gap-2">🔐 Admin</button>
                <button id="btnLogout" onclick="logout()" class="hidden bg-red-600 text-white font-bold py-2 px-4 rounded-md shadow-md flex items-center gap-2">🚪 Logout</button>
            </div>
        </div>
    </header>

    <nav class="bg-corp-lightBlue border-b border-slate-700 shadow-md z-10">
        <div class="container mx-auto px-4 flex space-x-1 overflow-x-auto">
            <button onclick="switchTab('request')" id="tab-request" class="tab-btn px-6 py-3 text-sm font-medium border-b-2 border-transparent text-corp-gold border-corp-gold transition">📝 แจ้งซ่อม</button>
            <button onclick="switchTab('status')" id="tab-status" class="tab-btn px-6 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-white transition">📊 ติดตามงาน</button>
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-btn hidden admin-only px-6 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-white transition">📈 แดชบอร์ด</button>
            <button onclick="switchTab('settings')" id="tab-settings" class="tab-btn hidden admin-only px-6 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-white transition">⚙️ ตั้งค่า</button>
        </div>
    </nav>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-900/50 relative">
        <div id="view-request" class="view-section max-w-3xl mx-auto">
            <div class="bg-corp-lightBlue rounded-xl shadow-2xl border border-slate-700 overflow-hidden">
                <div class="bg-gradient-to-r from-corp-blue to-corp-lightBlue p-4 border-b border-slate-700"><h2 class="text-xl font-bold text-white">📝 แบบฟอร์มแจ้งซ่อม</h2></div>
                <div class="p-6">
                    <form id="requestForm" onsubmit="submitRequest(event)" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div><label class="block text-sm text-slate-400 mb-1">ชื่อผู้แจ้ง</label><input type="text" id="reqName" required class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"></div>
                            <div><label class="block text-sm text-slate-400 mb-1">สถานที่</label><select id="reqDept" required class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"><option value="">-- โหลดข้อมูล --</option></select></div>
                            <div><label class="block text-sm text-slate-400 mb-1">เบอร์ติดต่อ</label><input type="tel" id="reqPhone" required class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"></div>
                            <div><label class="block text-sm text-slate-400 mb-1">รหัสอุปกรณ์ (ถ้ามี)</label><input type="text" id="reqEquipId" class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"></div>
                            <div class="md:col-span-2"><label class="block text-sm text-slate-400 mb-1">ชื่ออุปกรณ์ / ปัญหาที่พบ</label><input type="text" id="reqEquip" required class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"></div>
                        </div>
                        <div><label class="block text-sm text-slate-400 mb-1">รายละเอียดเพิ่มเติม</label><textarea id="reqDetail" rows="3" required class="w-full bg-slate-900 border border-slate-600 rounded px-4 py-2"></textarea></div>
                        
                        <div>
                            <label class="block text-sm text-slate-400 mb-2 font-bold">📸 แนบรูปภาพก่อนซ่อม</label>
                            <input type="file" id="reqPhoto" accept="image/*" onchange="previewImage(this, 'before-preview')" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-slate-700 file:text-slate-200">
                            <img id="before-preview" class="preview-img">
                        </div>

                        <div><label class="block text-sm text-slate-400 mb-3">ระดับความเร่งด่วน</label>
                            <div class="flex gap-4">
                                <label class="flex-1 text-center p-3 rounded border border-slate-600 has-[:checked]:bg-green-500/10 has-[:checked]:border-green-500 cursor-pointer"><input type="radio" name="urgency" value="Low" class="hidden" checked><span class="text-green-400">ปกติ</span></label>
                                <label class="flex-1 text-center p-3 rounded border border-slate-600 has-[:checked]:bg-yellow-500/10 has-[:checked]:border-yellow-500 cursor-pointer"><input type="radio" name="urgency" value="Medium" class="hidden"><span class="text-yellow-400">ด่วน</span></label>
                                <label class="flex-1 text-center p-3 rounded border border-slate-600 has-[:checked]:bg-red-500/10 has-[:checked]:border-red-500 cursor-pointer"><input type="radio" name="urgency" value="High" class="hidden"><span class="text-red-400">ด่วนมาก</span></label>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-corp-gold to-yellow-600 hover:from-yellow-500 text-corp-blue font-bold py-3 rounded shadow-lg">🚀 ส่งข้อมูลแจ้งซ่อม</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="view-status" class="view-section hidden container mx-auto">
            <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold text-white">📂 แฟ้มงานซ่อม</h2><input onkeyup="renderStatus(this.value)" placeholder="🔍 ค้นหาเลขที่งาน..." class="bg-slate-900 border border-slate-600 rounded-full px-4 py-2 text-sm w-64"></div>
            <div id="statusFolders" class="space-y-4"></div>
        </div>

        <div id="view-dashboard" class="view-section hidden container mx-auto">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="kpi-stats"></div>
            <div class="bg-corp-lightBlue rounded-xl shadow-2xl border border-slate-700 overflow-hidden">
                <div class="p-4 border-b border-slate-700 bg-slate-800 flex justify-between"><h2 class="text-xl font-bold text-corp-gold">📋 จัดการงานซ่อม</h2></div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left" id="adminTable">
                        <thead class="bg-slate-900 text-slate-400 text-xs uppercase"><tr><th class="p-4">Action</th><th class="p-4">ID</th><th class="p-4">User</th><th class="p-4">Equipment</th><th class="p-4">Status</th></tr></thead>
                        <tbody id="adminTableBody" class="text-sm divide-y divide-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-settings" class="view-section hidden max-w-2xl mx-auto">
            <div class="bg-corp-lightBlue p-6 rounded-xl border border-slate-700">
                <h3 class="text-corp-gold font-bold mb-4 border-b border-slate-700 pb-2">⚙️ ตั้งค่าระบบ</h3>
                <label class="block text-xs text-slate-400 mb-1">API URL (Google Apps Script)</label>
                <input id="setting-api-url" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-xs mb-4">
                <button onclick="saveSystemSettings()" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold">บันทึก & รีโหลด</button>
            </div>
        </div>
    </main>

    <div id="adminModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-corp-lightBlue w-full max-w-2xl rounded-xl border border-slate-600 shadow-2xl p-6 overflow-y-auto max-h-[90vh]">
            <h3 class="text-xl font-bold text-corp-gold mb-4 border-b border-slate-700 pb-2">Manage Job: <span id="modalJobDisplay"></span></h3>
            <input type="hidden" id="modalJobId">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div><label class="text-xs text-slate-400">สถานะ</label><select id="modalStatus" onchange="toggleAdminPhoto()" class="w-full bg-slate-900 border border-slate-600 rounded p-2"><option>Waiting</option><option>Processing</option><option>Done</option></select></div>
                <div><label class="text-xs text-slate-400">ช่างผู้รับงาน</label><select id="modalTech" class="w-full bg-slate-900 border border-slate-600 rounded p-2"></select></div>
            </div>
            <div class="mb-4"><label class="text-xs text-slate-400">บันทึกเพิ่มเติม</label><textarea id="modalRemark" class="w-full bg-slate-900 border border-slate-600 rounded p-2" rows="2"></textarea></div>
            
            <div id="adminPhotoSection" class="hidden border-t border-slate-700 pt-4 mb-4">
                <label class="block text-sm text-green-400 mb-2 font-bold">📸 แนบรูปภาพหลังซ่อม (เสร็จสิ้นงาน)</label>
                <input type="file" id="modalPhoto" accept="image/*" onchange="previewImage(this, 'after-preview')" class="w-full text-xs text-slate-400">
                <img id="after-preview" class="preview-img">
            </div>

            <div id="costSection" class="hidden border-t border-slate-600 pt-4">
                <h4 class="text-green-400 font-bold mb-2 flex justify-between"><span>💰 สรุปค่าใช้จ่าย</span><span id="grandTotal">0.00 ฿</span></h4>
                <div id="itemsContainer" class="space-y-2 mb-2"></div>
                <button onclick="addItemRow()" class="text-xs bg-slate-700 px-2 py-1 rounded">+ เพิ่มรายการอะไหล่</button>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeModal()" class="px-4 py-2 text-slate-400 hover:bg-slate-700 rounded">ยกเลิก</button>
                <button onclick="saveJob()" class="bg-corp-gold text-corp-blue font-bold px-8 py-2 rounded">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG & STATE ---
        let appData = {
            reqs: [], lists: { depts: [], techs: [] }, isAdmin: false,
            cfg: { apiUrl: '', adminPass: '888', jobId: { prefix: 'MTN', digits: 4 } }
        };

        // --- NEW API CALLER (POST) ---
        async function callApi(act, payload = {}) {
            if(!appData.cfg.apiUrl) return;
            const formData = new FormData();
            formData.append('action', act);
            for (let key in payload) { formData.append(key, payload[key]); }
            try {
                const response = await fetch(appData.cfg.apiUrl, { method: 'POST', body: formData });
                return await response.json();
            } catch (e) { console.error(e); return {status:'error', message:'Connection Error'}; }
        }

        // --- HELPERS ---
        function getBase64(file) {
            return new Promise((resolve) => {
                if (!file) resolve("");
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
            });
        }

        function previewImage(input, previewId) {
            const preview = document.getElementById(previewId);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => { preview.src = e.target.result; preview.style.display = 'block'; }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- CORE LOGIC ---
        document.addEventListener('DOMContentLoaded', () => { loadSettings(); refreshData(); });

        async function submitRequest(e) {
            e.preventDefault();
            Swal.fire({title:'กำลังส่งข้อมูล...', allowOutsideClick:false, didOpen:()=>Swal.showLoading()});
            
            const photoBase64 = await getBase64(document.getElementById('reqPhoto').files[0]);
            const p = {
                requesterName: document.getElementById('reqName').value,
                positionDept: document.getElementById('reqDept').value,
                phoneNumber: document.getElementById('reqPhone').value,
                equipmentLocation: (document.getElementById('reqEquipId').value ? `[${document.getElementById('reqEquipId').value}] ` : '') + document.getElementById('reqEquip').value,
                problemDetails: document.getElementById('reqDetail').value,
                urgency: document.querySelector('input[name="urgency"]:checked').value,
                status: 'Waiting',
                photoBefore: photoBase64
            };

            const r = await callApi('submit', p);
            if(r.status==='success') {
                Swal.fire('สำเร็จ!', `เลขที่งาน: ${r.jobId}`, 'success');
                document.getElementById('requestForm').reset();
                document.getElementById('before-preview').style.display='none';
                refreshData(); switchTab('status');
            } else Swal.fire('Error', r.message, 'error');
        }

        async function saveJob() {
            const st = document.getElementById('modalStatus').value;
            const photoAfterBase64 = st === 'Done' ? await getBase64(document.getElementById('modalPhoto').files[0]) : "";
            
            let it=[], cost=0;
            if(st==='Done') document.querySelectorAll('.item-row').forEach(r=>{
                const n=r.querySelector('.i-n').value, q=r.querySelector('.i-q').value, p=r.querySelector('.i-p').value;
                if(n) { const t=q*p; it.push({name:n, q:q, p:p, t:t}); cost+=t; }
            });

            Swal.fire({title:'กำลังบันทึก...', allowOutsideClick:false, didOpen:()=>Swal.showLoading()});
            const p = {
                jobId: document.getElementById('modalJobId').value,
                status: st,
                technician: document.getElementById('modalTech').value,
                adminRemarks: document.getElementById('modalRemark').value,
                cost: cost,
                itemsData: JSON.stringify(it),
                photoAfter: photoAfterBase64
            };

            const r = await callApi('update', p);
            if(r.status==='success') { closeModal(); refreshData(); Swal.fire('Saved','','success'); }
        }

        // --- UI RENDERERS ---
        async function refreshData() {
            const r = await callApi('fetch');
            if(r && r.status==='success') {
                appData.reqs = r.data;
                appData.lists = r.lists || { depts: [], techs: [] };
                renderStatus(); renderDrops();
                if(appData.isAdmin) { renderAdmin(); renderDashboard(); }
            }
        }

        function renderStatus(q='') {
            const c = document.getElementById('statusFolders'); c.innerHTML = '';
            const filtered = appData.reqs.filter(r => (r.jobID + r.requesterName).toLowerCase().includes(q.toLowerCase()));
            filtered.forEach(r => {
                let sClass = r.status === 'Waiting' ? 'status-waiting' : (r.status === 'Done' ? 'text-green-400 font-bold' : 'text-blue-400 font-bold');
                c.innerHTML += `
                    <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 flex justify-between items-center">
                        <div><div class="text-xs text-corp-gold font-mono">${r.jobID}</div><div class="font-bold">${r.equipmentLocation}</div></div>
                        <div class="${sClass} text-sm uppercase">${r.status}</div>
                    </div>`;
            });
        }

        function renderAdmin() {
            document.getElementById('adminTableBody').innerHTML = appData.reqs.map(r => `
                <tr class="hover:bg-slate-800 border-b border-slate-700">
                    <td class="p-4"><button onclick="openModal('${r.jobID}')" class="bg-blue-600 px-3 py-1 rounded text-xs">Edit</button></td>
                    <td class="p-4 font-mono text-corp-gold">${r.jobID}</td>
                    <td class="p-4">${r.requesterName}</td>
                    <td class="p-4">${r.equipmentLocation}</td>
                    <td class="p-4 ${r.status==='Waiting'?'status-waiting':''}">${r.status}</td>
                </tr>`).join('');
        }

        function renderDrops() {
            const opt = (list) => '<option value="">-- เลือก --</option>' + list.map(x => `<option value="${x}">${x}</option>`).join('');
            document.getElementById('reqDept').innerHTML = opt(appData.lists.depts || []);
            document.getElementById('modalTech').innerHTML = opt(appData.lists.techs || []);
        }

        function renderDashboard() {
            const r = appData.reqs;
            const stats = [
                { label: 'TOTAL', val: r.length, color: 'white' },
                { label: 'WAITING', val: r.filter(x=>x.status==='Waiting').length, color: 'yellow-400' },
                { label: 'PROCESS', val: r.filter(x=>x.status==='Processing').length, color: 'blue-400' },
                { label: 'DONE', val: r.filter(x=>x.status==='Done').length, color: 'green-400' }
            ];
            document.getElementById('kpi-stats').innerHTML = stats.map(s => `
                <div class="bg-corp-lightBlue p-4 rounded-xl border border-slate-700 shadow-lg">
                    <div class="text-slate-400 text-xs font-bold">${s.label}</div>
                    <div class="text-3xl font-bold text-${s.color} mt-1">${s.val}</div>
                </div>`).join('');
        }

        // --- SYSTEM ---
        function toggleAdminPhoto() {
            const isDone = document.getElementById('modalStatus').value === 'Done';
            document.getElementById('adminPhotoSection').classList.toggle('hidden', !isDone);
            document.getElementById('costSection').classList.toggle('hidden', !isDone);
        }

        function openModal(id) {
            const r = appData.reqs.find(x => x.jobID === id);
            if(!r) return;
            document.getElementById('modalJobId').value = id;
            document.getElementById('modalJobDisplay').innerText = id;
            document.getElementById('modalStatus').value = r.status;
            document.getElementById('modalTech').value = r.technician || "";
            document.getElementById('modalRemark').value = r.adminRemarks || "";
            document.getElementById('itemsContainer').innerHTML = '';
            document.getElementById('after-preview').style.display = 'none';
            toggleAdminPhoto();
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('adminModal').classList.add('hidden'); }

        function switchTab(id) {
            document.querySelectorAll('.view-section').forEach(e => e.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.replace('text-corp-gold', 'text-slate-400'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('border-corp-gold'));
            document.getElementById('view-' + id).classList.remove('hidden');
            document.getElementById('tab-' + id).classList.replace('text-slate-400', 'text-corp-gold');
            document.getElementById('tab-' + id).classList.add('border-corp-gold');
        }

        async function showLoginModal() {
            const {value:p} = await Swal.fire({title:'Admin Login', input:'password', background:'#1e293b', color:'#fff'});
            if(p===appData.cfg.adminPass) {
                appData.isAdmin=true; document.querySelectorAll('.admin-only').forEach(e=>e.classList.remove('hidden'));
                document.getElementById('btnLogin').classList.add('hidden'); document.getElementById('btnLogout').classList.remove('hidden');
                refreshData(); switchTab('dashboard');
            }
        }

        function saveSystemSettings() {
            appData.cfg.apiUrl = document.getElementById('setting-api-url').value.trim();
            localStorage.setItem('vschem_cfg_v2', JSON.stringify(appData.cfg));
            location.reload();
        }

        function loadSettings() {
            const c = JSON.parse(localStorage.getItem('vschem_cfg_v2') || '{}');
            appData.cfg = {...appData.cfg, ...c};
            document.getElementById('setting-api-url').value = appData.cfg.apiUrl;
        }

        function addItemRow() {
            const d = document.createElement('div'); d.className='grid grid-cols-6 gap-2 item-row';
            d.innerHTML = `<input class="col-span-3 bg-slate-900 border border-slate-600 rounded px-1 i-n" placeholder="ชื่ออะไหล่"><input type="number" class="col-span-1 bg-slate-900 border border-slate-600 rounded px-1 i-q" value="1" onchange="calcTotal()"><input type="number" class="col-span-1 bg-slate-900 border border-slate-600 rounded px-1 i-p" value="0" onchange="calcTotal()"><button onclick="this.parentElement.remove();calcTotal()" class="text-red-400">×</button>`;
            document.getElementById('itemsContainer').appendChild(d);
        }

        function calcTotal() {
            let t=0; document.querySelectorAll('.item-row').forEach(r => t += r.querySelector('.i-q').value * r.querySelector('.i-p').value);
            document.getElementById('grandTotal').innerText = t.toFixed(2) + ' ฿';
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
